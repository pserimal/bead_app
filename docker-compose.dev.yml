# 013 决议：本地开发覆盖。
# 发布 postgres 5432 / python 8001 便于调试；模型挂载宿主机真实 artifact。
# 用法：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

services:
  db:
    ports:
      - "5432:5432"

  python-crnn:
    ports:
      - "8001:8001"
    volumes:
      # dev：模型直接挂载训练产物（010 R3 契约：目录含 model.pt）
      - ${MODEL_ARTIFACT_HOST_DIR:-./artifacts/models/current}:/models:ro
      - ./image_service:/app/image_service
      - ./ocr_core:/app/ocr_core
    command: uvicorn image_service.app.main:app --host 0.0.0.0 --port 8001 --reload
