spring:
  application:
    name: bead-server
  datasource:
    url: jdbc:postgresql://192.168.5.88:5432/bead_app
    username: admin
    password: "123456"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # 允许 clean（bead.db.recreate-on-start=true 时 drop 重建需要）
    clean-disabled: false
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 31MB

bead:
  # 默认保留历史数据；只有显式设置 BEAD_DB_RECREATE_ON_START=true 才重建数据库。
  db:
    recreate-on-start: ${BEAD_DB_RECREATE_ON_START:false}
  recovery:
    interval-ms: 30000
  storage:
    dir: ./uploads
  python:
    base-url: http://localhost:8001
  ocr:
    # 生产推理模型快照名（image_service 实际加载 artifacts/models/current）
    model-snapshot: ${BEAD_OCR_MODEL_SNAPSHOT:bean-mard-v1}
  cors:
    # allowedOriginPatterns（支持通配）：本机直连 + 局域网设备经 Vite proxy（http://<设备IP>:5173）
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://*:5173}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
