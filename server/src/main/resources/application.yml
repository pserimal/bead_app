spring:
  application:
    name: bead-server
  datasource:
    url: jdbc:postgresql://192.168.5.88:5432/bead_app
    username: admin
    password: "123456"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

bead:
  recovery:
    interval-ms: 30000
  storage:
    dir: ./uploads
  python:
    base-url: http://localhost:8001
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
