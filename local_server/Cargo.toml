[package]
name = "bead-local-server"
version = "0.2.0"
edition = "2024"
description = "ai_dou local LAN server — axum API + SQLite + ONNX CRNN OCR (Rust runtime, mirrors the Kotlin cloud server contract)"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart", "json"] }
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ndarray = "0.17"
# ort: dynamic loading of onnxruntime.dll (1.23.2, matching the Python
# reference/acceptance toolchain). The DLL ships next to the exe at deploy
# time; ORT_DYLIB_PATH overrides the search path during development.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-23"] }
rusqlite = { version = "0.40", features = ["bundled"] }
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
strip = true
