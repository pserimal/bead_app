[package]
name = "bead-local-server"
version = "0.1.0"
edition = "2024"
description = "ai_dou local LAN server — axum API + SQLite + ONNX CRNN OCR (Rust runtime, mirrors the Kotlin cloud server contract)"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ndarray = "0.17"
# ort: dynamic loading of onnxruntime.dll (1.23.2, matching the Python
# reference/acceptance toolchain). The DLL ships next to the exe at deploy
# time; ORT_DYLIB_PATH overrides the search path during development.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-23"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
